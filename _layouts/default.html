<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}Enravage</title>
<meta name="description" content="Enravage picks the photos worth posting. Everything is analysed on your iPhone.">
<style>
:root { --canvas:#F2F1EE; --card:#FAF9F7; --ink:#1C1B19; --slate:#5C5A55; --gray:#77736C; --red:#B3261E; --line:#DEDCD6; }
@media (prefers-color-scheme: dark) { :root { --canvas:#121211; --card:#1D1C1A; --ink:#F2F1EE; --slate:#A9A59E; --gray:#9C988F; --red:#E2574B; --line:#2E2D2A; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--canvas); color:var(--ink); font:17px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
header, main, footer { max-width:720px; margin:0 auto; padding:0 20px; }
header { display:flex; align-items:center; gap:12px; padding-top:28px; padding-bottom:8px; }
header a { color:var(--ink); text-decoration:none; font-weight:700; font-size:20px; display:flex; align-items:center; gap:10px; }
nav { margin-left:auto; display:flex; gap:16px; font-size:15px; }
nav a { color:var(--slate); text-decoration:none; } nav a:hover { color:var(--ink); }
main { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:8px 28px 28px; margin-top:16px; }
h1 { font-size:30px; line-height:1.2; margin:24px 0 8px; } h2 { font-size:20px; margin:28px 0 6px; }
a { color:var(--ink); } p, li { color:var(--ink); } strong { font-weight:650; }
footer { color:var(--slate); font-size:13px; padding:20px 20px 40px; }
@media (max-width:520px) { main { padding:4px 18px 20px; } nav { gap:12px; font-size:14px; } h1 { font-size:26px; } }
</style>
</head>
<body>
<header>
  <a href="{{ '/' | relative_url }}"><svg width="30" height="30" viewBox="0 0 100 100" aria-hidden="true"><g fill="currentColor"><rect x="24" y="24" width="8" height="52"/><rect x="24" y="24" width="32" height="8"/><rect x="24" y="46" width="25" height="8"/><rect x="24" y="68" width="32" height="8"/></g><g fill="var(--gray)"><rect x="64" y="24" width="14.25" height="6.5"/><rect x="71.75" y="24" width="6.5" height="14.25"/><rect x="71.75" y="61.75" width="6.5" height="14.25"/><rect x="64" y="69.5" width="14.25" height="6.5"/></g><circle cx="65" cy="50" r="7" fill="none" stroke="var(--gray)" stroke-width="2.4"/><circle cx="65" cy="50" r="2.4" fill="var(--red)"/></svg>Enravage</a>
  <nav aria-label="Main"><a href="{{ '/privacy/' | relative_url }}">Privacy</a> · <a href="{{ '/terms/' | relative_url }}">Terms</a> · <a href="{{ '/support/' | relative_url }}">Support</a></nav>
</header>
<main>
{{ content }}
</main>
<footer>© 2026 Elijah J. Matz. Enravage is an independent app, not affiliated with, endorsed or sponsored by Instagram, Meta, Apple or any other company, app or service.</footer>
</body>
</html>
